<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/add-profile.css">
    <title>Profile</title>
</head>

<body>
    <div id="navigation">
        <div id="left-nav">
            <img src="assets/images/namelogo.png">
        </div>

        <div id="right-nav">
            <a href="main-page.html">Home</a>
            <a href="my-movies.html">My movies</a>
            <a href="add-movie.html">+ Add</a>
            <a style="background-color: #933b5b; color: white;" href="profile.html">Profile</a>
            <a href="front-page.html">Log out</a>
        </div>
    </div>

    <br>
    <h1>PROFILE</h1>

<!-- Profile Section -->
<div class="profile-header">
    <div class="profile-avatar">
        <img id="profileImage" src="assets/images/default-avatar.png" alt="">
    </div>
    <div class="profile-info">
        <h2 id="profileUsername">Loading...</h2>
        <p id="profileEmail">Loading...</p>
        <p id="profileBio" class="bio-text">No bio yet.</p>
    </div>
    <div class="profile-actions">
        <button id="editProfileBtn" class="edit-profile-btn">Edit Profile</button>
    </div>
</div>

<!-- Edit Profile Form -->
<div id="editProfileForm" class="edit-form" style="display: none;">
    <h3>Edit Profile</h3>
    <div class="form-group">
        <label>Username</label>
        <input type="text" id="editUsername" placeholder="Username">
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="editEmail" placeholder="Email">
    </div>
    <div class="form-group">
        <label>Profile Picture URL</label>
        <input type="text" id="editProfileImageUrl" placeholder="https://...">
        <small>Or upload using the button above as your avatar.</small>
    </div>
    <div class="form-group">
        <label>Bio</label>
        <textarea id="editBio" rows="3" placeholder="Tell us about yourself..."></textarea>
    </div>
    <div class="form-buttons">
        <button id="saveProfileBtn" class="save-btn">Save Changes</button>
        <button id="cancelEditBtn" class="cancel-btn">Cancel</button>
    </div>
</div>

    <br>

    <div id="stats">
        <div id="card-one" class="card">
            <div class="stat-value" id="totalMovies">0</div>
            <div class="stat-label">Total Movies</div>
        </div>
        <div id="card-two" class="card">
            <div class="stat-value" id="watchedCount">0</div>
            <div class="stat-label">Watched</div>
        </div>
        <div id="card-three" class="card">
            <div class="stat-value" id="watchlistCount">0</div>
            <div class="stat-label">Watchlist</div>
        </div>
        <div id="card-four" class="card">
            <div class="stat-value" id="avgRating">0</div>
            <div class="stat-label">Avg Rating ☆</div>
        </div>
        <div id="card-five" class="card">
            <div class="stat-value" id="totalMin">0</div>
            <div class="stat-label">Watched (min)</div>
        </div>
    </div>

    <!--Något för månad/år statestikenn-->

    <footer>
        <p> © 2026 CineLog.</p>
    </footer>
</body>

</html>
